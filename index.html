<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <div class="score">
        <p>Vous</p>
        <p>Ordinateur</p>
        <p id="score-joueur">0</p>
        <p id="score-ordinateur">0</p>
        <div id="reset">Recommencer</div>
    </div>
    <div class="action">
        <p id="message">A vous de jouer !</p>
        <div id="next">Tour suivant</div>
    </div>
    <div class="jeu">
        <div class="choix">
            <div class="button btn-joueur" id="pierre">
                <img src="./assets/pierre.png" alt="Pierre"/>
                <p>Pierre</p>
            </div>

            <div class="button btn-joueur" id="papier">
                <img src="./assets/papier.png" alt="Papier"/>
                <p>Papier</p>
            </div>

            <div class="button btn-joueur" id="ciseaux">
                <img src="./assets/ciseaux.png" alt="Ciseaux"/>
                <p>Ciseaux</p>
            </div>
        </div>

                <div class="choix">
            <div class="button btn-ordinateur" id="opierre">
                <img src="./assets/pierre.png" alt="Pierre"/>
                <p>Pierre</p>
            </div>

            <div class="button btn-ordinateur" id="opapier">
                <img src="./assets/papier.png" alt="Papier"/>
                <p>Papier</p>
            </div>

            <div class="button btn-ordinateur" id="ociseaux">
                <img src="./assets/ciseaux.png" alt="Ciseaux"/>
                <p>Ciseaux</p>
            </div>
        </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
